name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Настраиваем сборщик в правильной папке
    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.9
      working-directory: './secret-app'

    - name: Update distribution URL
      run: sed -i 's/gradle-8.5-bin.zip/gradle-8.9-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
      working-directory: './secret-app'

    # Собираем приложение
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: './secret-app'

    # Сохраняем готовый APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: keyboard-app
        path: secret-app/app/build/outputs/apk/debug/app-debug.apk
