name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Меняем версию с 8.5 на 8.10 для совместимости
    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.10
      working-directory: './СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ'

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: './СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: keyboard-app
        path: СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ/app/build/outputs/apk/debug/app-debug.apk
