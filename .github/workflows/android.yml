name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Указываем роботу правильную папку для создания сборщика
    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5
      working-directory: './СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ'

    # Указываем роботу ту же папку для запуска самой сборки
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: './СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ'

    # Готовый APK забираем из папки приложения
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: keyboard-app
        path: СУПЕР СЕКРЕТНОЕ ПРИЛОЖЕНИЕ/app/build/outputs/apk/debug/app-debug.apk
